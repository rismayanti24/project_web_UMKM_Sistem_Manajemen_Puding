<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - WarungPudding</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--lavender), var(--pink-soft));
        }
    </style>
</head>
<body>

    <div class="login-container w-100 px-3">
        <div class="card text-center mb-3">
            <a href="index.html" class="nav-logo justify-content-center mb-4" style="font-size: 2rem;">
                <i class="fas fa-ice-cream"></i> WarungPudding
            </a>
            
            <h2 class="mb-4" style="color: var(--text-dark);">Login Portal</h2>
            
            <div id="errorMessage" class="toast error mb-3" style="display: none; animation: none; margin-top: 0; position: static;">
                <i class="fas fa-exclamation-circle"></i>
                <span id="errorText">Username atau Password salah!</span>
            </div>

            <form id="loginForm" style="text-align: left;">
                <div class="form-group">
                    <label class="form-label">Username</label>
                    <div style="position: relative;">
                        <i class="fas fa-user" style="position: absolute; left: 15px; top: 15px; color: var(--text-light);"></i>
                        <input type="text" id="username" class="form-control" placeholder="Masukkan username" style="padding-left: 45px;" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <div style="position: relative;">
                        <i class="fas fa-lock" style="position: absolute; left: 15px; top: 15px; color: var(--text-light);"></i>
                        <input type="password" id="password" class="form-control" placeholder="Masukkan password" style="padding-left: 45px;" required>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary w-100" style="width: 100%; padding: 12px; margin-top: 10px;">
                    Login <i class="fas fa-sign-in-alt"></i>
                </button>
            </form>
            
            <div class="mt-3">
                <a href="index.html" style="color: var(--purple-accent); font-size: 0.9rem;"><i class="fas fa-arrow-left"></i> Kembali ke Beranda</a>
            </div>
        </div>
        
        <div class="login-hint">
            <p><strong><i class="fas fa-info-circle"></i> Data Simulasi Login:</strong></p>
            <ul style="margin-left: 20px; margin-top: 10px;">
                <li>Admin: <code>admin</code> / <code>admin123</code></li>
                <li>Karyawan: <code>karyawan</code> / <code>karya123</code></li>
                <li>Pelanggan: <code>pelanggan</code> / <code>user123</code></li>
            </ul>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/validation.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Memeriksa jika pengguna sudah masuk sebelumnya (ada sesi aktif)
            const user = JSON.parse(localStorage.getItem('wp_user'));
            if (user) {
                // Jika sudah login, langsung alihkan ke halaman dashboard masing-masing peran
                redirectBasedOnRole(user.role);
            }

            // Mendengarkan pengiriman formulir Login (Submit Form)
            document.getElementById('loginForm').addEventListener('submit', (e) => {
                // Mencegah halaman dimuat ulang saat submit
                e.preventDefault();
                
                // Mengambil nilai input username dan password
                const userVal = document.getElementById('username').value;
                const passVal = document.getElementById('password').value;
                // Mendapatkan elemen pesan error global
                const errorMsg = document.getElementById('errorMessage');
                
                // Melakukan validasi format form login terlebih dahulu (min panjang karakter)
                if (!validateLoginForm()) {
                    return; // Batalkan proses jika input tidak sesuai standar format
                }
                
                // Menjalankan fungsi login dari js/auth.js
                if (login(userVal, passVal)) {
                    // Sembunyikan pesan error jika login sukses
                    errorMsg.style.display = 'none';
                    // Ambil sesi terbaru untuk dialihkan ke halaman dashboard yang tepat
                    const userObj = JSON.parse(localStorage.getItem('wp_user'));
                    redirectBasedOnRole(userObj.role);
                } else {
                    // Tampilkan pesan kesalahan berwarna merah jika username/password salah
                    errorMsg.style.display = 'flex';
                }
            });
        });
    </script>
</body>
</html>
