<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Produk - Admin WarungPudding</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
    <!-- Dashboard Layout -->
    <div class="dashboard-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="p-3 text-center mb-4 mt-3">
                <i class="fas fa-user-shield fa-4x mb-2" style="color: var(--purple-accent);"></i>
                <h3 id="displayUserName">Admin</h3>
                <span class="badge" style="background: var(--pink-soft); color: var(--text-dark);">Administrator</span>
            </div>
            
            <nav class="sidebar-menu">
                <a href="dashboard.html" class="sidebar-link">
                    <i class="fas fa-tachometer-alt"></i> Dashboard
                </a>
                <a href="kelola-produk.html" class="sidebar-link active">
                    <i class="fas fa-box-open"></i> Kelola Produk
                </a>
                <a href="laporan.html" class="sidebar-link">
                    <i class="fas fa-chart-bar"></i> Laporan
                </a>
                <a href="#" onclick="logout(); return false;" class="sidebar-link" style="color: #E74C3C;">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>Kelola Produk</h2>
                <button onclick="openProductModal()" class="btn btn-primary">
                    <i class="fas fa-plus"></i> Tambah Produk
                </button>
            </div>
            
            <div class="dashboard-card">
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>No</th>
                                <th>Foto</th>
                                <th>Nama Produk</th>
                                <th>Kategori</th>
                                <th>Harga</th>
                                <th>Stok</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="productsTableBody">
                            <!-- Injected via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Product Modal (Add/Edit) -->
    <div id="productModal" class="modal">
        <div class="modal-content">
            <button onclick="closeModal('productModal')" class="modal-close"><i class="fas fa-times"></i></button>
            <h2 id="modalTitle" class="mb-4" style="color: var(--purple-accent);">Tambah Produk</h2>
            
            <form id="productForm">
                <input type="hidden" id="prodId">
                
                <div class="form-group">
                    <label class="form-label">Nama Produk *</label>
                    <input type="text" id="prodNama" class="form-control" required>
                </div>
                
                <div class="d-flex gap-3" style="flex-wrap: wrap;">
                    <div class="form-group" style="flex: 1;">
                        <label class="form-label">Kategori *</label>
                        <select id="prodKategori" class="form-control" required>
                            <option value="">Pilih Kategori</option>
                            <option value="Coklat">Coklat</option>
                            <option value="Strawberry">Strawberry</option>
                            <option value="Matcha">Matcha</option>
                            <option value="Vanilla">Vanilla</option>
                            <option value="Dinosaurus">Dinosaurus</option>
                            <option value="Kelinci">Kelinci</option>
                        </select>
                    </div>
                    
                    <div class="form-group" style="flex: 1;">
                        <label class="form-label">Harga (Rp) *</label>
                        <input type="number" id="prodHarga" class="form-control" required min="1000">
                    </div>
                </div>

                <div class="d-flex gap-3" style="flex-wrap: wrap;">
                    <div class="form-group" style="flex: 1;">
                        <label class="form-label">Stok *</label>
                        <input type="number" id="prodStok" class="form-control" required min="0">
                    </div>
                    
                    <div class="form-group" style="flex: 1;">
                        <label class="form-label">Foto Produk</label>
                        <select id="prodGambar" class="form-control">
                            <option value="images/Puding Coklat Dino.jpg">Puding Coklat Dino</option>
                            <option value="images/Puding Mangga Dino.jpg">Puding Mangga Dino</option>
                            <option value="images/kaki kucing puding.jpg">Kaki Kucing Puding</option>
                            <option value="images/kelinci puding.jpeg">Kelinci Puding</option>
                            <option value="images/puding dino.jpg">Puding Dino</option>
                            <option value="images/puding tusuk.jpg">Puding Tusuk</option>
                            <option value="images/dino blue.jpg">Permen Karet Dino</option>
                            <option value="images/dino pink.jpg">Strawberry Dino</option>
                        </select>
                        <small style="color: var(--text-light);">(Simulasi upload foto)</small>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Deskripsi</label>
                    <textarea id="prodDeskripsi" class="form-control"></textarea>
                </div>
                
                <div class="d-flex gap-2 justify-content-center mt-4">
                    <button type="button" onclick="closeModal('productModal')" class="btn btn-outline" style="flex: 1;">Batal</button>
                    <button type="submit" class="btn btn-primary" style="flex: 1;">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/firebase-sync.js"></script>

    <!-- Scripts -->
    <script src="../js/auth.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/cart.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Protect Page - stop execution if not authorized
            const user = await checkAuth('admin');
            if (!user) return;
            
            renderProductsTable();

            // Listen to firebase-sync updates for real-time table updates
            window.addEventListener('wp_products_sync', () => {
                renderProductsTable();
            });

            // Handle Form Submit
            document.getElementById('productForm').addEventListener('submit', (e) => {
                e.preventDefault();
                
                const id = document.getElementById('prodId').value || 'p' + Math.floor(Math.random() * 1000);
                const isNew = !document.getElementById('prodId').value;
                
                const productData = {
                    id: id,
                    nama: document.getElementById('prodNama').value,
                    kategori: document.getElementById('prodKategori').value,
                    harga: parseInt(document.getElementById('prodHarga').value),
                    stok: parseInt(document.getElementById('prodStok').value),
                    gambar: document.getElementById('prodGambar').value,
                    deskripsi: document.getElementById('prodDeskripsi').value,
                    tersedia: parseInt(document.getElementById('prodStok').value) > 0
                };

                const products = getProducts();
                
                if (isNew) {
                    products.push(productData);
                    showToast('Produk berhasil ditambahkan!');
                } else {
                    const idx = products.findIndex(p => p.id === id);
                    if (idx > -1) {
                        products[idx] = productData;
                        showToast('Produk berhasil diperbarui!');
                    }
                }
                
                // Simpan ke Firebase Realtime Database
                db.ref('products').set(products).then(() => {
                    closeModal('productModal');
                }).catch(err => {
                    console.error("Gagal menyimpan ke Firebase:", err);
                    showToast('Gagal menyimpan ke database cloud!', 'error');
                });
            });
        });

        function renderProductsTable() {
            const products = getProducts();
            const tbody = document.getElementById('productsTableBody');
            
            if (products.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4">Belum ada produk.</td></tr>';
                return;
            }

            tbody.innerHTML = products.map((p, index) => {
                const stockColor = p.stok > 10 ? 'color: #2ECC71;' : p.stok > 0 ? 'color: #F39C12;' : 'color: #E74C3C;';
                
                return `
                    <tr>
                        <td>${index + 1}</td>
                        <td>
                            <img src="../${p.gambar}" alt="${p.nama}" style="width: 50px; height: 50px; object-fit: cover; border-radius: 8px;" onerror="this.src='https://placehold.co/50/E6CCFF/9B59B6'">
                        </td>
                        <td style="font-weight: 600;">${p.nama}</td>
                        <td><span class="badge" style="background: var(--bg-light); color: var(--purple-accent);">${p.kategori}</span></td>
                        <td>Rp ${p.harga.toLocaleString('id-ID')}</td>
                        <td style="font-weight: bold; ${stockColor}">${p.stok}</td>
                        <td>
                            <button onclick="editProduct('${p.id}')" class="btn" style="background: var(--lavender); color: var(--purple-accent); padding: 5px 10px; margin-right: 5px;">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button onclick="deleteProduct('${p.id}')" class="btn" style="background: #FDEDEC; color: #E74C3C; padding: 5px 10px;">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        window.openProductModal = function() {
            document.getElementById('productForm').reset();
            document.getElementById('prodId').value = '';
            document.getElementById('modalTitle').textContent = 'Tambah Produk';
            
            // Adjust image paths for admin relative to root
            const imgSelect = document.getElementById('prodGambar');
            Array.from(imgSelect.options).forEach(opt => {
                if(!opt.value.startsWith('../')) {
                   // Keep the value as images/... but we display it normally
                }
            });

            openModal('productModal');
        };

        window.editProduct = function(id) {
            const products = getProducts();
            const product = products.find(p => p.id === id);
            
            if (product) {
                document.getElementById('prodId').value = product.id;
                document.getElementById('prodNama').value = product.nama;
                document.getElementById('prodKategori').value = product.kategori;
                document.getElementById('prodHarga').value = product.harga;
                document.getElementById('prodStok').value = product.stok;
                document.getElementById('prodGambar').value = product.gambar;
                document.getElementById('prodDeskripsi').value = product.deskripsi;
                
                document.getElementById('modalTitle').textContent = 'Edit Produk';
                openModal('productModal');
            }
        };

        window.deleteProduct = function(id) {
            if (confirm('Apakah Anda yakin ingin menghapus produk ini?')) {
                let products = getProducts();
                products = products.filter(p => p.id !== id);
                db.ref('products').set(products).then(() => {
                    showToast('Produk dihapus!', 'error'); // Using error style for deletion toast
                }).catch(err => {
                    console.error("Gagal menghapus dari Firebase:", err);
                    showToast('Gagal menghapus produk dari database cloud!', 'error');
                });
            }
        };
    </script>
</body>
</html>
